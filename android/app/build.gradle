// تطبيق أندرويد للوحة التحكم بس: شاشة واحدة بتفتح https://ziadzakaria-creator.github.io/GTECH/admin/
// بيتبني أوتوماتيك على GitHub (.github/workflows/android.yml)، وأي تعديل في اللوحة بيوصله من غير تحديث للتطبيق
plugins {
    id "com.android.application"
    id "com.google.firebase.crashlytics"
}

// Firebase Crashlytics: بيبلّغ عن أي قفلة للتطبيق في Firebase Console.
// بيشتغل بس لما يكون فيه google-services.json (الـ workflow بيكتبه من secret اسمه GOOGLE_SERVICES_JSON)،
// ومن غيره التطبيق بيتبني عادي من غير تقارير.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace "com.gtech.admin"
    compileSdk 34

    defaultConfig {
        applicationId "com.gtech.admin"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            // المفتاح بيتعمل جديد في كل build (مش محفوظ في الـ repo لأنه عام)
            storeFile file(System.getenv("KEYSTORE") ?: "release.jks")
            storePassword System.getenv("KEY_PASS")
            keyAlias "gtech"
            keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.0.0")
    implementation "com.google.firebase:firebase-crashlytics"
}
