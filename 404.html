<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>GTECH | الصفحة مش موجودة</title>
  <script>
    // منتج جديد لسه ماتعملهوش صفحة ثابتة (بتتعمل مع النشر الجاي) ← نفتحه من صفحة المنتج العادية
    (function () {
      var m = location.pathname.match(/^(.*\/)p\/(\d+)\.html$/);
      if (m) location.replace(m[1] + "product.html?id=" + m[2]);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070b14; color: #e8eefc; font-family: Cairo, Tahoma, sans-serif; text-align: center; }
    a { display: inline-block; margin-top: 14px; padding: 12px 28px; border-radius: 999px; background: #0a84ff; color: #fff; text-decoration: none; font-weight: 700; }
    p { color: #8a98b8; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:48px">🔍</div>
    <h1>الصفحة دي مش موجودة</h1>
    <p>ممكن يكون الرابط غلط أو الصفحة اتشالت.</p>
    <a id="home" href="/">ارجع للمتجر</a>
  </div>
  <script>
    var base = location.pathname.match(/^\/[^/]+\//);
    if (base && location.hostname.endsWith("github.io")) document.getElementById("home").href = base[0];
  </script>
</body>
</html>
