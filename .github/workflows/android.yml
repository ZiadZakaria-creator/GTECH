name: Build admin Android app

# بيبني تطبيق لوحة التحكم (APK) وينزله في Releases لما فولدر android يتغير
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Firebase config (Crashlytics)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # لو الـ secret موجود، التطبيق بيتبني بتقارير Crashlytics. لو مش موجود بيتبني عادي.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Crashlytics: on"
          else
            echo "Crashlytics: off (add the GOOGLE_SERVICES_JSON secret to turn it on)"
          fi

      - name: Build signed APK
        run: |
          # مفتاح توقيع جديد لكل build (الـ repo عام، فمفيش مفتاح محفوظ فيه)
          export KEY_PASS="$(openssl rand -hex 24)"
          export KEYSTORE="$RUNNER_TEMP/release.jks"
          export VERSION_CODE="${{ github.run_number }}"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
            -alias gtech -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GTECH Admin, O=GTECH, C=EG"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk gtech-admin.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-app-v${{ github.run_number }}
          name: "GTECH Admin (تطبيق لوحة التحكم) v${{ github.run_number }}"
          body: |
            تطبيق أندرويد للوحة تحكم GTECH.
            نزّل ملف gtech-admin.apk على الموبايل وافتحه. لو عندك نسخة قديمة، امسحها الأول.
          files: gtech-admin.apk
          make_latest: true
