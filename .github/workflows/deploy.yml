name: Deploy to GitHub Pages

# كل push على الفرع الافتراضي بينشر الموقع تلقائياً،
# وكمان كل 6 ساعات عشان صفحات المنتجات اللي جوجل بيقراها تتحدث بأسعار ومنتجات اللوحة
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir _site
          cp *.html *.css *.js *.webmanifest _site/
          cp -r icons admin _site/
          [ -d images ] && cp -r images _site/ || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build product pages for Google (SEO)
        run: node tools/build-seo.mjs _site "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
